name: Update PR with Vector Compatibility Advisory

on:
  workflow_run:
    workflows: ["Vector Compatibility Advisory"]
    types:
      - completed

permissions:
  contents: read

jobs:
  update-pr:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Download compatibility result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vector-compatibility-advisory
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Update label and comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const rawPRNumber = fs.readFileSync('pr-number', 'utf8').trim();
            const outcome = fs.readFileSync('outcome', 'utf8').trim();

            if (!/^\d+$/.test(rawPRNumber)) {
              core.setFailed('Invalid PR number');
              return;
            }
            if (!['success', 'failure'].includes(outcome)) {
              core.setFailed('Invalid compatibility outcome');
              return;
            }

            const prNumber = Number(rawPRNumber);
            const run = context.payload.workflow_run;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const matchesRun = pull.head.sha === run.head_sha
              && pull.head.ref === run.head_branch
              && pull.head.repo?.full_name === run.head_repository?.full_name;
            if (!matchesRun || pull.state !== 'open') {
              core.info('Ignoring an obsolete or unrelated workflow result');
              return;
            }

            const label = 'vector integration impact';
            const marker = '<!-- vector-compatibility-advisory -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body.startsWith(marker));

            if (outcome === 'failure') {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'FBCA04',
                  description: 'This PR requires evaluation or follow-up changes in Vector',
                });
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [label],
              });

              const runUrl = context.payload.workflow_run.html_url;
              const body = `${marker}\n### :warning: Vector compatibility advisory\n\nVector does not currently compile with this VRL change. This is advisory and does **not** block merging. No change to this PR is necessarily required; review [the workflow run](${runUrl}) to determine whether Vector needs a follow-up change.`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body,
                });
              }
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }
