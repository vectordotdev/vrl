name: Merge Queue

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  check-features:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: "Check that all features can compile"
        run: make check-features

  check-release:
    # A release PR is prepared from a fixed `main` commit. If another PR lands first,
    # its changelog fragment stays in `changelog.d/` at the release commit and the
    # release changelog misses it. Reject that group so the release is prepared again.
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release commit
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Most groups do not touch Cargo.toml. Skip building the release tool for them.
          if git diff --quiet "$BASE_SHA" HEAD -- Cargo.toml; then
            echo "Cargo.toml is unchanged, not a release."
            exit 0
          fi
          cargo run -q -p release -- release-commit --before "$BASE_SHA"

  merge-queue:
    if: always()
    needs:
      - check-features
      - check-release
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
