name: Publish release

# Publishes the crate to crates.io with trusted publishing (OIDC). No crates.io
# token is stored in the repository. The crates.io trusted publisher for `vrl`
# must reference this workflow file and the `crates-io` environment.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    # Runs repository and dependency code (build scripts, the release tool). It has no
    # `id-token: write`, so that code cannot request an OIDC token and exchange it for
    # crates.io credentials.
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag matches the crate version
        run: cargo run -q -p release -- check-tag "$GITHUB_REF_NAME"

      - name: Verify package
        run: cargo publish --dry-run --package vrl

  publish:
    # Only this job can request an OIDC token. It does not build or run repository code:
    # `cargo publish --no-verify` packages the sources without compiling them.
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Required to exchange the GitHub OIDC token for a crates.io token
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-verify --package vrl
