name: Publish release

# Publishes the crate to crates.io with trusted publishing (OIDC). No crates.io
# token is stored in the repository. The crates.io trusted publisher for `vrl`
# must reference this workflow file and the `crates-io` environment.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Required to exchange the GitHub OIDC token for a crates.io token
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag matches the crate version
        run: |
          set -euo pipefail
          version=$(cargo run -q -p release -- version)
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}." >&2
            exit 1
          fi

      # Build and verify the package before the crates.io token exists, so that
      # build scripts never run with the token in their environment.
      - name: Verify package
        run: cargo publish --dry-run --package vrl

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-verify --package vrl
