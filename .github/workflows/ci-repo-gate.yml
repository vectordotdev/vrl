name: CI Repository Gate

on:
  workflow_call:
    inputs:
      upstream-only:
        description: Restrict this workflow to the upstream repository.
        type: boolean
        default: false

permissions: {}

jobs:
  repo-gate:
    if: >-
      github.repository == 'vectordotdev/vrl' ||
      (!inputs.upstream-only && github.event_name != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Allow dependent jobs
        run: "true"
