# A separate full scan lets #vector-ops subscribe through the GitHub Slack app
# without receiving failures from unrelated Test Suite jobs. Daily scans also
# catch advisories published when there are no new commits.
# In #vector-ops, configure the GitHub app after this workflow is merged:
# /github subscribe vectordotdev/vrl workflows:{name:"Deny - Linux" event:"push","schedule","workflow_dispatch" branch:"main"}
name: Deny - Linux

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-deny:
    if: github.repository == 'vectordotdev/vrl'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check all cargo-deny errors
        run: make check-deny
